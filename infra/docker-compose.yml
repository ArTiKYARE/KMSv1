version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kms_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-secure_password_change_me}
      POSTGRES_DB: ${DB_NAME:-kms_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kms_admin} -d ${DB_NAME:-kms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kms-backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-kms_admin}
      - DB_PASS=${DB_PASS:-secure_password_change_me}
      - DB_NAME=${DB_NAME:-kms_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_key_change_in_prod}
      - JWT_EXPIRY=${JWT_EXPIRY:-15m}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-7d}
      - APP_ENV=${APP_ENV:-development}
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://frontend:80
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kms-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kms-network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  kms-network:
    driver: bridge
